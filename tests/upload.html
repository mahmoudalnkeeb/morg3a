<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Upload</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 600px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
        font-size: 28px;
        text-align: center;
      }

      .upload-area {
        border: 2px dashed #667eea;
        border-radius: 12px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        margin-bottom: 20px;
      }

      .upload-area:hover {
        border-color: #764ba2;
        background: #f8f9ff;
      }

      .upload-area.dragover {
        border-color: #764ba2;
        background: #f0f1ff;
        transform: scale(1.02);
      }

      #upload-file {
        display: none;
      }

      .upload-icon {
        font-size: 48px;
        margin-bottom: 10px;
      }

      .upload-text {
        color: #666;
        margin-bottom: 10px;
      }

      .file-info {
        background: #f8f9ff;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        display: none;
      }

      .file-info.show {
        display: block;
      }

      .file-name {
        font-weight: 600;
        color: #333;
        margin-bottom: 5px;
        word-break: break-all;
      }

      .file-size {
        color: #666;
        font-size: 14px;
      }

      .progress-container {
        margin-bottom: 20px;
        display: none;
      }

      .progress-container.show {
        display: block;
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: #e0e0e0;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        width: 0%;
        transition: width 0.3s;
      }

      .progress-text {
        color: #666;
        font-size: 14px;
        text-align: center;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      button {
        flex: 1;
        padding: 14px 28px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      #upload-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      #upload-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      #upload-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #pause-btn,
      #resume-btn,
      #cancel-btn {
        background: #f0f0f0;
        color: #333;
        display: none;
      }

      #pause-btn.show,
      #resume-btn.show,
      #cancel-btn.show {
        display: block;
      }

      #pause-btn:hover {
        background: #ffa726;
        color: white;
      }

      #resume-btn:hover {
        background: #66bb6a;
        color: white;
      }

      #cancel-btn:hover {
        background: #ef5350;
        color: white;
      }

      .status {
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        display: none;
      }

      .status.show {
        display: block;
      }

      .status.success {
        background: #e8f5e9;
        color: #2e7d32;
        border-left: 4px solid #4caf50;
      }

      .status.error {
        background: #ffebee;
        color: #c62828;
        border-left: 4px solid #f44336;
      }

      .ongoing-uploads {
        margin-top: 30px;
        padding-top: 30px;
        border-top: 2px solid #f0f0f0;
      }

      .ongoing-uploads h2 {
        font-size: 18px;
        color: #333;
        margin-bottom: 15px;
      }

      .ongoing-upload-item {
        background: #f8f9ff;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .ongoing-upload-info {
        flex: 1;
      }

      .ongoing-upload-name {
        font-weight: 600;
        color: #333;
        margin-bottom: 4px;
        font-size: 14px;
      }

      .ongoing-upload-progress {
        color: #666;
        font-size: 12px;
      }

      .resume-upload-btn {
        background: #667eea;
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .resume-upload-btn:hover {
        background: #764ba2;
      }

      .no-uploads {
        text-align: center;
        color: #999;
        font-size: 14px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📤 File Upload</h1>

      <div class="upload-area" id="upload-area">
        <div class="upload-icon">☁️</div>
        <div class="upload-text">Click to browse or drag and drop your file here</div>
        <input type="file" id="upload-file" />
      </div>

      <div class="file-info" id="file-info">
        <div class="file-name" id="file-name"></div>
        <div class="file-size" id="file-size"></div>
      </div>

      <div class="progress-container" id="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">Ready to upload</div>
      </div>

      <div class="button-group">
        <button id="upload-btn">Upload</button>
        <button id="pause-btn">Pause</button>
        <button id="resume-btn">Resume</button>
        <button id="cancel-btn">Cancel</button>
      </div>

      <div class="status" id="status"></div>

      <div class="ongoing-uploads">
        <h2>Pending Uploads</h2>
        <div id="ongoing-uploads-list"></div>
      </div>
    </div>

    <script>
      const uploadInput = document.getElementById('upload-file');
      const uploadArea = document.getElementById('upload-area');
      const uploadBtn = document.getElementById('upload-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const resumeBtn = document.getElementById('resume-btn');
      const cancelBtn = document.getElementById('cancel-btn');
      const progressFill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');
      const progressContainer = document.getElementById('progress-container');
      const fileInfo = document.getElementById('file-info');
      const fileName = document.getElementById('file-name');
      const fileSize = document.getElementById('file-size');
      const statusDiv = document.getElementById('status');
      const ongoingUploadsList = document.getElementById('ongoing-uploads-list');

      const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB
      const API_URL = 'http://localhost:3000/api/upload';

      let currentUpload = null;
      let isPaused = false;
      let isUploading = false;

      // Upload area interactions
      uploadArea.addEventListener('click', () => uploadInput.click());

      uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
      });

      uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
      });

      uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        const files = e.dataTransfer.files;
        if (files.length) {
          uploadInput.files = files;
          handleFileSelect();
        }
      });

      uploadInput.addEventListener('change', handleFileSelect);

      function handleFileSelect() {
        const files = uploadInput.files;
        if (!files.length) return;

        const file = files[0];
        fileName.textContent = file.name;
        fileSize.textContent = formatFileSize(file.size);
        fileInfo.classList.add('show');
        uploadBtn.disabled = false;
      }

      uploadBtn.addEventListener('click', startUpload);
      pauseBtn.addEventListener('click', pauseUpload);
      resumeBtn.addEventListener('click', resumeUpload);
      cancelBtn.addEventListener('click', cancelUpload);

      async function startUpload() {
        const files = uploadInput.files;
        if (!files.length || isUploading) return;

        const file = files[0];
        const fileId = generateFileId(file);

        // Check if there's a saved upload for this file
        const savedUpload = getSavedUpload(fileId);

        currentUpload = {
          file,
          fileId,
          totalParts: Math.ceil(file.size / CHUNK_SIZE),
          currentPart: savedUpload ? savedUpload.currentPart : 1,
          uploadId: savedUpload ? savedUpload.uploadId : null,
        };

        isUploading = true;
        isPaused = false;
        updateUI('uploading');
        await performUpload();
      }

      async function performUpload() {
        try {
          const { file, fileId, totalParts, uploadId } = currentUpload;
          let currentUploadId = uploadId;

          for (
            let partNumber = currentUpload.currentPart;
            partNumber <= totalParts;
            partNumber++
          ) {
            if (isPaused) {
              saveUploadProgress(fileId, partNumber, currentUploadId);
              return;
            }

            currentUpload.currentPart = partNumber;

            const start = (partNumber - 1) * CHUNK_SIZE;
            const end = Math.min(partNumber * CHUNK_SIZE, file.size);
            const chunk = file.slice(start, end);
            const isLast = partNumber === totalParts;

            const arrayBuffer = await chunk.arrayBuffer();
            const base64Chunk = arrayBufferToBase64(arrayBuffer);

            const body = {
              filename: file.name,
              partNumber,
              chunk: base64Chunk,
              isLast,
              ...(partNumber === 1
                ? { contentType: file.type }
                : { uploadId: currentUploadId }),
            };

            const res = await fetch(`${API_URL}/part`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });

            if (!res.ok) {
              throw new Error(`Upload failed: ${res.statusText}`);
            }

            const data = await res.json();

            if (partNumber === 1 && !currentUploadId) {
              currentUploadId = data.data.uploadId;
              currentUpload.uploadId = currentUploadId;
            }

            const progress = Math.round((partNumber / totalParts) * 100);
            updateProgress(progress, `Uploading part ${partNumber}/${totalParts}`);

            saveUploadProgress(fileId, partNumber + 1, currentUploadId);

            if (data.data.isDone) {
              clearUploadProgress(fileId);
              showStatus(`✅ Upload complete! File: ${data.data.location}`, 'success');
              resetUpload();
              return;
            }
          }
        } catch (error) {
          showStatus(`❌ Error: ${error.message}`, 'error');
          isPaused = true;
          updateUI('paused');
        }
      }

      function pauseUpload() {
        isPaused = true;
        isUploading = false;
        updateUI('paused');
        showStatus('⏸️ Upload paused', 'success');
      }

      function resumeUpload() {
        isPaused = false;
        isUploading = true;
        updateUI('uploading');
        showStatus('▶️ Resuming upload...', 'success');
        performUpload();
      }

      async function cancelUpload() {
        if (!currentUpload) return;

        isPaused = true;
        isUploading = false;

        if (currentUpload.uploadId) {
          try {
            await fetch(`${API_URL}/abort`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                uploadId: currentUpload.uploadId,
                filename: currentUpload.file.name,
              }),
            });
          } catch (error) {
            console.error('Error aborting upload:', error);
          }
        }

        clearUploadProgress(currentUpload.fileId);
        showStatus('🚫 Upload cancelled', 'error');
        resetUpload();
      }

      function updateProgress(percent, text) {
        progressFill.style.width = `${percent}%`;
        progressText.textContent = text;
      }

      function updateUI(state) {
        progressContainer.classList.add('show');

        if (state === 'uploading') {
          uploadBtn.style.display = 'none';
          pauseBtn.classList.add('show');
          resumeBtn.classList.remove('show');
          cancelBtn.classList.add('show');
        } else if (state === 'paused') {
          uploadBtn.style.display = 'none';
          pauseBtn.classList.remove('show');
          resumeBtn.classList.add('show');
          cancelBtn.classList.add('show');
        } else if (state === 'idle') {
          uploadBtn.style.display = 'block';
          pauseBtn.classList.remove('show');
          resumeBtn.classList.remove('show');
          cancelBtn.classList.remove('show');
        }
      }

      function resetUpload() {
        currentUpload = null;
        isUploading = false;
        isPaused = false;
        updateUI('idle');
        updateProgress(0, 'Ready to upload');
        uploadInput.value = '';
        fileInfo.classList.remove('show');
        progressContainer.classList.remove('show');
        loadOngoingUploads();
      }

      function showStatus(message, type) {
        statusDiv.textContent = message;
        statusDiv.className = `status show ${type}`;
        setTimeout(() => {
          statusDiv.classList.remove('show');
        }, 5000);
      }

      // LocalStorage functions
      function generateFileId(file) {
        return `${file.name}_${file.size}_${file.lastModified}`;
      }

      function saveUploadProgress(fileId, currentPart, uploadId) {
        const uploads = JSON.parse(localStorage.getItem('uploads') || '{}');
        uploads[fileId] = {
          filename: currentUpload.file.name,
          fileSize: currentUpload.file.size,
          currentPart,
          totalParts: currentUpload.totalParts,
          uploadId,
          timestamp: Date.now(),
        };
        localStorage.setItem('uploads', JSON.stringify(uploads));
        loadOngoingUploads();
      }

      function getSavedUpload(fileId) {
        const uploads = JSON.parse(localStorage.getItem('uploads') || '{}');
        return uploads[fileId];
      }

      function clearUploadProgress(fileId) {
        const uploads = JSON.parse(localStorage.getItem('uploads') || '{}');
        delete uploads[fileId];
        localStorage.setItem('uploads', JSON.stringify(uploads));
        loadOngoingUploads();
      }

      function loadOngoingUploads() {
        const uploads = JSON.parse(localStorage.getItem('uploads') || '{}');
        const uploadKeys = Object.keys(uploads);

        if (uploadKeys.length === 0) {
          ongoingUploadsList.innerHTML =
            '<div class="no-uploads">No pending uploads</div>';
          return;
        }

        ongoingUploadsList.innerHTML = uploadKeys
          .map((fileId) => {
            const upload = uploads[fileId];
            const progress = Math.round((upload.currentPart / upload.totalParts) * 100);
            return `
                    <div class="ongoing-upload-item">
                        <div class="ongoing-upload-info">
                            <div class="ongoing-upload-name">${upload.filename}</div>
                            <div class="ongoing-upload-progress">
                                ${formatFileSize(upload.fileSize)} • ${progress}% complete •
                                Part ${upload.currentPart}/${upload.totalParts}
                            </div>
                        </div>
                        <button class="resume-upload-btn" onclick="resumeSavedUpload('${fileId}')">
                            Resume
                        </button>
                    </div>
                `;
          })
          .join('');
      }

      window.resumeSavedUpload = function (fileId) {
        showStatus('⚠️ Please select the file again to resume upload', 'error');
      };

      function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
      }

      function arrayBufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      // Load ongoing uploads on page load
      loadOngoingUploads();
    </script>
  </body>
</html>
