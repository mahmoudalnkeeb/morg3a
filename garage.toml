# Garage configuration file - minimal setup for object storage

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

db_engine = "sqlite"
replication_mode = "1"

rpc_bind_addr = "0.0.0.0:3900"
rpc_public_addr = "garage:3900"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3902"
root_domain = ".s3.garage"

bootstrap_peers = []
